name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ~/.bun/install/cache

      - name: Phantom dependency check (apps/web)
        run: |
          set -euo pipefail
          # depcheck exits 255 for findings, including unused dependencies.
          code=0
          RESULT=$(bunx depcheck --json --skip-missing=false \
            --ignores="@types/*,@tailwindcss/postcss,tailwindcss,eslint,eslint-config-next,@playwright/test,@testing-library/*,@vitejs/plugin-react,jsdom,typescript,vitest,@types/node") || code=$?
          if (( code != 0 && code != 255 )); then exit "$code"; fi
          jq -es 'length == 1 and (.[0].missing | type == "object") and (.[0].dependencies | type == "array")' <<< "$RESULT" >/dev/null || {
            echo "::error::depcheck did not return a complete report"
            exit 1
          }
          MISSING=$(echo "$RESULT" | jq -r '.missing | keys | length')
          UNUSED=$(echo "$RESULT" | jq -r '.dependencies | length')
          if [ "$UNUSED" -gt 0 ]; then
            echo "::warning::Unused dependencies in apps/web/package.json: $(echo "$RESULT" | jq -rc '.dependencies')"
          fi
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::Phantom dependencies found (imported but not in package.json):"
            echo "$RESULT" | jq '.missing'
            exit 1
          fi
          echo "No phantom dependencies."
        working-directory: apps/web

      - name: Lint web
        run: bun run lint --max-warnings 0
        working-directory: apps/web

      - name: Typecheck web and shared
        run: bun run typecheck --filter=@straude/web

      - name: Test (web)
        run: bun run test
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: sb_secret_placeholder

  web-runtime:
    strategy:
      fail-fast: false
      matrix:
        shard: [app, global]
    uses: ./.github/workflows/web-runtime.yml
    with:
      shard: ${{ matrix.shard }}

  native-runtime:
    uses: ./.github/workflows/web-runtime.yml
    with:
      shard: native

  cli-package:
    name: CLI package
    outputs:
      package-sha: ${{ steps.package.outputs.sha }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck CLI
        run: bun run typecheck
        working-directory: packages/cli

      - name: Test CLI
        run: bun run test
        working-directory: packages/cli

      - name: Pack release candidate
        id: package
        run: |
          mkdir -p ../../artifacts
          npm pack --json --pack-destination ../../artifacts
          echo "sha=$(sha256sum ../../artifacts/*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        working-directory: packages/cli

      - name: Upload exact package
        uses: actions/upload-artifact@v7
        with:
          name: straude-cli-package
          path: artifacts/*.tgz
          if-no-files-found: error

  cli-package-matrix:
    name: CLI package (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: cli-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: straude-cli-package
          path: artifacts

      - name: Test installed package
        run: node packages/cli/scripts/packaged-cli-e2e.mjs --tarball artifacts --source-commit ${{ github.sha }}

      - name: Preserve installed package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: straude-cli-evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: packages/cli/test-results/packaged-cli-e2e.json
          if-no-files-found: warn

  ci:
    if: always()
    needs: [web-checks, web-runtime, native-runtime, cli-package, cli-package-matrix]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")
            and (.["cli-package"].outputs["package-sha"] | test("^[0-9a-f]{64}$"))
            and (.["cli-package"].outputs["package-sha"] == .["native-runtime"].outputs["package-sha"])' <<< "$RESULTS"
