name: Runtime benchmark

on:
  push:
    branches:
      - oh-ci-runtime-bench-startup
      - oh-ci-runtime-bench-legacy
      - oh-ci-runtime-bench-docker
      - oh-ci-runtime-bench-native

  workflow_dispatch:
    inputs:
      mode:
        description: "Startup compares all engines. A runtime name runs the full suite."
        type: choice
        options: [startup, legacy, docker, native]
        default: startup
      replicas:
        description: "Number of paired cold and warm samples per engine for startup mode."
        type: choice
        options: ["1", "3", "5"]
        default: "5"

permissions:
  contents: read

jobs:
  startup:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'startup') || (github.event_name == 'push' && github.ref_name == 'oh-ci-runtime-bench-startup')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [legacy, docker, native]
        sample: ${{ fromJSON(inputs.replicas == '1' && '[1]' || inputs.replicas == '3' && '[1,2,3]' || '[1,2,3,4,5]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ matrix.runtime == 'legacy' && '2.75.0' || '3.4.0' }}
      - name: Measure cold stack startup and readiness
        timeout-minutes: 10
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: .github/scripts/measure-supabase.sh "$RUNTIME" cold
      - name: Measure startup and readiness with cached artifacts
        timeout-minutes: 10
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: .github/scripts/measure-supabase.sh "$RUNTIME" warm

  full:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'startup') || (github.event_name == 'push' && github.ref_name != 'oh-ci-runtime-bench-startup')
    uses: ./.github/workflows/ci.yml
    with:
      benchmark: true
      supabase-runtime: ${{ inputs.mode || (endsWith(github.ref_name, '-legacy') && 'legacy' || endsWith(github.ref_name, '-docker') && 'docker' || 'native') }}
