name: Runtime benchmark

on:
  push:
    branches:
      - oh-ci-runtime-bench
      - oh-ci-runtime-bench-legacy
      - oh-ci-runtime-bench-docker
      - oh-ci-runtime-bench-native

permissions:
  contents: read

jobs:
  startup:
    if: github.ref_name == 'oh-ci-runtime-bench'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [legacy, docker, native]
        sample: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ matrix.runtime == 'legacy' && '2.75.0' || '3.4.0' }}
      - name: Measure cold stack startup and readiness
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: .github/scripts/measure-supabase.sh "$RUNTIME" cold
      - name: Measure startup and readiness with cached artifacts
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: .github/scripts/measure-supabase.sh "$RUNTIME" warm

  full:
    if: github.ref_name != 'oh-ci-runtime-bench'
    uses: ./.github/workflows/ci.yml
    with:
      benchmark: true
      supabase-runtime: ${{ endsWith(github.ref_name, '-legacy') && 'legacy' || endsWith(github.ref_name, '-docker') && 'docker' || 'native' }}
