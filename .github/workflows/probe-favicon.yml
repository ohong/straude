name: Favicon fixture benchmark
on:
  push:
    branches: [oh-favicon-fixture-benchmark]
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        lifetime: [per-case, shared]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.3.3}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - uses: supabase/setup-cli@v3
        with: {version: 2.75.0}
      - name: Start fresh local database and install locked dependencies
        run: |
          supabase start --exclude studio,postgres-meta,logflare,vector,edge-runtime >/dev/null 2>&1 &
          pid=$!
          bun install --frozen-lockfile
          (cd apps/web && bunx playwright install --with-deps chromium)
          wait "$pid"
          bun run local:env
      - name: Build the production app
        run: bun run build --filter=@straude/web
      - name: Test independent fixture lifetimes on real browsers
        working-directory: apps/web
        env:
          LIFETIME: ${{ matrix.lifetime }}
        run: |
          if [[ "$LIFETIME" == shared ]]; then cp scripts/shared-favicon-spec.fixture e2e/team-favicon-save.spec.ts; fi
          bun run test:e2e e2e/team-favicon-save.spec.ts --no-deps --project=chromium --grep 'cached rectangular' --repeat-each=12 --workers=1 --retries=0 --reporter=list
